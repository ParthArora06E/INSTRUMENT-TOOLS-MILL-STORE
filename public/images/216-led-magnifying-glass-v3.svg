<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f0f5"/>
    </radialGradient>
    
    <!-- Metallic Handle Gradient -->
    <linearGradient id="handle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#888"/>
      <stop offset="50%" stop-color="#ccc"/>
      <stop offset="100%" stop-color="#666"/>
    </linearGradient>

    <!-- Glass Gradient -->
    <radialGradient id="glass" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.9)"/>
      <stop offset="50%" stop-color="rgba(200,220,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(100,150,255,0.2)"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="10" dy="15" stdDeviation="15" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <g transform="translate(40, -40)" filter="url(#shadow)">
    <!-- Handle -->
    <rect x="220" y="220" width="30" height="130" rx="15" transform="rotate(45, 235, 285)" fill="url(#handle)"/>
    
    <!-- Handle Grips -->
    <path d="M 180 280 L 210 310" stroke="#444" stroke-width="4" transform="rotate(45, 195, 295)"/>
    <path d="M 190 290 L 220 320" stroke="#444" stroke-width="4" transform="rotate(45, 205, 305)"/>
    <path d="M 200 300 L 230 330" stroke="#444" stroke-width="4" transform="rotate(45, 215, 315)"/>
    
    <!-- Frame -->
    <circle cx="150" cy="150" r="90" fill="none" stroke="#333" stroke-width="25"/>
    <circle cx="150" cy="150" r="102" fill="none" stroke="#777" stroke-width="4"/>
    
    <!-- LEDs -->
    <g fill="#e6ffff" filter="url(#glow)">
      <circle cx="150" cy="67" r="4"/>
      <circle cx="233" cy="150" r="4"/>
      <circle cx="150" cy="233" r="4"/>
      <circle cx="67" cy="150" r="4"/>
      
      <circle cx="208" cy="91" r="4"/>
      <circle cx="208" cy="208" r="4"/>
      <circle cx="91" cy="208" r="4"/>
      <circle cx="91" cy="91" r="4"/>
    </g>

    <!-- Glass -->
    <circle cx="150" cy="150" r="77" fill="url(#glass)"/>
    
    <!-- Reflections -->
    <path d="M 100 90 Q 150 70 200 110 Q 170 120 120 120 Z" fill="rgba(255,255,255,0.7)"/>
  </g>
</svg>